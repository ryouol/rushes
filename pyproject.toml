[project]
name = "rushes"
version = "0.1.0"
description = "Local-first footage worklog and selects"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.135,<1",
  "uvicorn[standard]>=0.41,<1",
  "pydantic-settings>=2.12,<3",
  "sqlalchemy[asyncio]>=2.0.48,<2.1",
  "alembic>=1.18,<2",
  "psycopg[binary,pool]>=3.3,<4",
  "fastapi-users[sqlalchemy]>=15,<16",
  "python-multipart>=0.0.22,<1",
  "temporalio>=1.23,<2",
  "pgvector>=0.4,<1",
  "google-genai>=1.66,<2",
  "google-auth>=2.49,<3",
  "httpx>=0.28,<1",
  "scenedetect[opencv-headless]>=0.6.7,<0.7",
  "faster-whisper>=1.2,<2",
  "fastembed>=0.7,<1",
  "modal>=1.5,<2",
]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "httpx>=0.28,<1", "ruff>=0.15,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/rushes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires the local PostgreSQL service", "media: invokes FFmpeg", "provider: requires explicitly configured Gemini credentials"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
