name: rushes
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: rushes
      POSTGRES_USER: rushes_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/configure.py first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rushes_admin -d rushes"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  postgres:
